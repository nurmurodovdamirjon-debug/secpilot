openapi: 3.1.0
info:
  title: SecPilot Defense API
  version: 1.0.0
  description: Telegram-first defensive cybersecurity monitoring, audit, and defense API.
servers:
  - url: http://localhost:8000
paths:
  /health/live:
    get:
      summary: Liveness check
      responses:
        "200":
          description: OK
  /health/ready:
    get:
      summary: Readiness check
      responses:
        "200":
          description: Ready
  /api/v1/assets:
    get:
      summary: List authorized assets
      security:
        - apiKeyAuth: []
      parameters:
        - name: include_deleted
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Asset list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Asset"
        "401":
          description: Unauthorized
    post:
      summary: Create authorized asset
      security:
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssetCreate"
      responses:
        "201":
          description: Asset created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Asset"
        "401":
          description: Unauthorized
        "409":
          description: Duplicate asset
        "422":
          description: Invalid target
  /api/v1/assets/{asset_id}:
    get:
      summary: Get authorized asset
      security:
        - apiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/AssetId"
      responses:
        "200":
          description: Asset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Asset"
        "404":
          description: Asset not found
    patch:
      summary: Update authorized asset
      security:
        - apiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/AssetId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssetUpdate"
      responses:
        "200":
          description: Asset updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Asset"
        "404":
          description: Asset not found
    delete:
      summary: Soft delete authorized asset
      security:
        - apiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/AssetId"
      responses:
        "204":
          description: Asset soft deleted
        "404":
          description: Asset not found
  /api/v1/audits/web:
    post:
      summary: Roadmap create web audit job
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebAuditRequest"
      responses:
        "202":
          description: Job queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobAccepted"
        "403":
          description: Scope denied
  /api/v1/jobs/{job_id}:
    get:
      summary: Roadmap get job status
      parameters:
        - name: job_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Job status
  /api/v1/incidents/{incident_id}/actions/block-ip:
    post:
      summary: Roadmap approval-gated source IP block
      security:
        - bearerAuth: []
      parameters:
        - name: incident_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "202":
          description: Action accepted
components:
  parameters:
    AssetId:
      name: asset_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  securitySchemes:
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    AssetCreate:
      type: object
      required:
        - asset_type
        - value
      properties:
        asset_type:
          type: string
          enum: [domain, ip, cidr, url]
        value:
          type: string
          maxLength: 512
        label:
          type:
            - string
            - "null"
          maxLength: 255
    AssetUpdate:
      type: object
      properties:
        label:
          type:
            - string
            - "null"
          maxLength: 255
        status:
          type: string
          enum: [active, deleted]
    Asset:
      type: object
      properties:
        id:
          type: string
          format: uuid
        asset_type:
          type: string
        value:
          type: string
        normalized_value:
          type: string
        label:
          type:
            - string
            - "null"
        status:
          type: string
        created_at:
          type: string
          format: date-time
    WebAuditRequest:
      type: object
      required:
        - asset_id
        - target
      properties:
        asset_id:
          type: string
        target:
          type: string
          format: uri
        priority:
          type: string
          enum: [low, normal, high]
          default: normal
    JobAccepted:
      type: object
      properties:
        job_id:
          type: string
        status:
          type: string
          example: queued
