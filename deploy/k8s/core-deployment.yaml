apiVersion: apps/v1
kind: Deployment
metadata:
  name: secpilot-api
  namespace: secpilot
spec:
  replicas: 2
  selector:
    matchLabels:
      app: secpilot-api
  template:
    metadata:
      labels:
        app: secpilot-api
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: api
          image: registry.example.com/secpilot:latest
          ports:
            - containerPort: 8000
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8000
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8000
